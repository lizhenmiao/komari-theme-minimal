<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>console - 设计稿 / 首页</title>
    <script>
      /* 主题在首帧之前定好，避免闪白。默认深色（本设计稿以深色为主基调）。 */
      try {
        if (localStorage.getItem('km-console-theme') === 'light')
          document.documentElement.classList.remove('dark')
      } catch {}
    </script>
    <style>
      /* ============================================================
       * 设计稿 v2「console」：监控终端风格
       * 与 v1「minimal」（浅色玻璃拟态）刻意拉开差距：
       *   深色为主 / 左侧栏 / 硬边框面板 / 等宽数字 /
       *   LED 分段仪表条 / 环形仪表 / 自绘 SVG 趋势图
       * 零外部依赖：图标内联、旗帜用仓库自托管 public/flags/。
       * ============================================================ */
      * { box-sizing: border-box; }
      html { height: 100%; }
      body {
        margin: 0;
        min-height: 100%;
        font: 14px/1.5 system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }
      html.dark  { color-scheme: dark; }
      html:not(.dark) { color-scheme: light; }

      :root {
        /* 浅色：中性纸面。同一套变量换值。 */
        --bg: #f3f5f8;
        --bg-side: #eef0f4;
        --panel: #ffffff;
        --panel2: #f4f6f9;
        --border: #dfe3e9;
        --border2: #c9cfd8;
        --text: #1d2632;
        --dim: #5d6a78;
        --faint: #8b96a3;
        --track: #e8ebf0;
        --tip: #ffffff;
        --bg-field: linear-gradient(180deg, #f3f5f8 0%, #eceff4 100%);
        --blob1: rgba(59, 130, 246, 0.09);
        --blob2: rgba(99, 102, 241, 0.07);
        --accent: #2563eb;
        --accent-soft: rgba(37, 99, 235, 0.10);

        --cpu: #0891b2;
        --mem: #c026d3;
        --disk: #d97706;
        --swap: #65a30d;
        --up: #0891b2;
        --down: #6366f1;
        --quo: #0284c7;
        --ok: #059669;
        --warn: #ea580c;
        --bad: #e11d48;
      }
      html.dark {
        --bg: #0b0d10;
        --bg-side: #0d0f13;
        --panel: #12151a;
        --panel2: #171b21;
        --border: #22262d;
        --border2: #31363f;
        --text: #dce4ee;
        --dim: #93a1b1;
        --faint: #5c6a79;
        --track: #1b1f26;
        --tip: #161a20;
        --bg-field: linear-gradient(180deg, #0e1015 0%, #0a0c10 100%);
        --blob1: rgba(59, 130, 246, 0.16);
        --blob2: rgba(99, 102, 241, 0.11);
        --accent: #3b82f6;
        --accent-soft: rgba(59, 130, 246, 0.14);

        --cpu: #22d3ee;
        --mem: #e879f9;
        --disk: #fbbf24;
        --swap: #a3e635;
        --up: #22d3ee;
        --down: #818cf8;
        --quo: #38bdf8;
        --ok: #34d399;
        --warn: #fb923c;
        --bad: #fb7185;
      }

      .mono { font-family: ui-monospace, 'Cascadia Mono', Consolas, 'JetBrains Mono', Menlo, monospace; }
      .num  { font-family: ui-monospace, 'Cascadia Mono', Consolas, 'JetBrains Mono', Menlo, monospace; font-variant-numeric: tabular-nums; }

      /*
       * 背景层：中性色场 + 两团同色系光晕缓慢游移。
       * 克制的环境动效：透明度低到不干扰数据，但流动可见；
       * 只做 transform 动画（合成器友好），面板全部实色。
       */
      .bg-layer {
        position: fixed; inset: 0; z-index: -1;
        pointer-events: none; overflow: hidden;
        background: var(--bg-field);
      }
      .bl {
        position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%;
        filter: blur(80px); will-change: transform;
      }
      .bl-a {
        top: -26vmax; left: -16vmax;
        background: radial-gradient(circle at 42% 42%, var(--blob1), transparent 64%);
        animation: bl-a 34s ease-in-out infinite alternate;
      }
      .bl-b {
        top: 14vmax; right: -30vmax;
        background: radial-gradient(circle at 55% 45%, var(--blob2), transparent 64%);
        animation: bl-b 44s ease-in-out infinite alternate;
      }
      @keyframes bl-a {
        to { transform: translate3d(11vw, 9vh, 0) scale(1.16); }
      }
      @keyframes bl-b {
        from { transform: translate3d(0, 0, 0) scale(1.06); }
        to   { transform: translate3d(-9vw, -7vh, 0) scale(1); }
      }

      /* ---------- 顶栏 ---------- */
      .topbar {
        position: sticky; top: 0; z-index: 20;
        display: flex; align-items: center; gap: 10px;
        height: 54px; padding: 0 20px;
        background: color-mix(in srgb, var(--bg) 72%, transparent);
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
      }
      /* ---------- 品牌图标 ----------
       * 圆角方框里一道监测脉冲波：两段心跳折线（青→紫渐变）+
       * 右上角在线灯。线宽随尺寸缩放（vector-effect），36px 到 16px 都清晰。 */
      /* 品牌图标：黑底 + 白色折线，主题无关，两种模式观感一致 */
      .bmark {
        display: grid; place-items: center;
        width: 34px; height: 34px; flex-shrink: 0;
        border: 1px solid rgba(255, 255, 255, 0.09); border-radius: 9px;
        background: #0a0a0c;
        box-shadow: 0 1px 4px rgba(2, 6, 12, 0.25);
      }
      .bmark svg { width: 22px; height: 22px; display: block; }
      .bmark .pw { stroke: #fff; }
      .bmark.sm { width: 30px; height: 30px; border-radius: 8px; }
      .bmark.sm svg { width: 19px; height: 19px; }
      .pt-title { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
      .tb-div { width: 1px; height: 18px; background: var(--border); flex-shrink: 0; }
      .refresh { font-size: 11.5px; color: var(--faint); }

      .ibtn {
        display: grid; place-items: center; width: 32px; height: 32px;
        border: 1px solid transparent; border-radius: 7px;
        background: none; color: var(--dim); cursor: pointer;
        transition: color 0.15s, border-color 0.15s, background 0.15s;
      }
      .ibtn:hover { color: var(--text); border-color: var(--border2); background: var(--panel2); }
      .ibtn svg { width: 16px; height: 16px; }

      .seg {
        display: inline-flex; gap: 2px; padding: 2px;
        border: 1px solid var(--border); border-radius: 8px; background: var(--panel);
      }
      .seg button {
        border: 0; border-radius: 6px; padding: 5px 12px; cursor: pointer;
        font: 500 12.5px/1.2 inherit; color: var(--dim); background: none;
        transition: color 0.15s, background 0.15s;
      }
      .seg button:hover { color: var(--text); }
      /* 激活态：反白，终端味 */
      .seg button.on { background: var(--text); color: var(--bg); font-weight: 600; }
      html.dark .seg button.on { background: #e6edf5; color: #0a0d12; }

      /* ---------- 主内容 ---------- */
      main { flex: 1; width: 100%; max-width: 1560px; margin: 0 auto; padding: 18px 20px 8px; }

      .panel {
        background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
      }

      /* ---------- 顶部汇总条：四格集群状态 ---------- */
      .summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); overflow: hidden; margin-bottom: 14px; }
      .scell { padding: 13px 18px; min-width: 0; }
      .scell + .scell { border-top: 1px solid var(--border); }
      .slb { margin: 0 0 4px; font-size: 11px; color: var(--faint); letter-spacing: 0.06em; }
      .sval { margin: 0; font-size: 18px; font-weight: 650; line-height: 1.25; }
      .sval .mut { color: var(--faint); font-weight: 400; font-size: 12px; }
      .sval.compact { font-size: 15px; }
      @media (min-width: 640px) {
        .summary { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .scell + .scell { border-top: 0; border-left: 1px solid var(--border); }
      }

      /* 节点卡网格：auto-fill，不用断点枚举 */
      .grid-nodes {
        display: grid; gap: 12px;
        grid-template-columns: repeat(auto-fill, minmax(min(370px, 100%), 1fr));
      }

      .ncard {
        display: flex; flex-direction: column; gap: 10px;
        padding: 14px 14px 12px; position: relative;
        transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
        cursor: pointer;
      }
      .ncard:hover { border-color: var(--border2); transform: translateY(-1px); box-shadow: 0 6px 18px rgba(2, 6, 12, 0.25); }
      html:not(.dark) .ncard:hover { box-shadow: 0 6px 18px rgba(30, 41, 59, 0.1); }
      /* 离线：整卡降饱和 */
      .ncard.off .metric-area, .ncard.off .spark, .ncard.off .netrow, .ncard.off .plrow { opacity: 0.45; }

      /* 卡头：国旗 系统 LED 名字 标签 ? */
      .chead { display: flex; align-items: center; gap: 8px; }
      .chead .ident { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
      .flag { width: 20px; height: 15px; object-fit: cover; border-radius: 2px; box-shadow: 0 0 0 1px rgba(128, 140, 155, 0.35); flex-shrink: 0; display: block; }
      .osic { width: 15px; height: 15px; flex-shrink: 0; }
      .led { position: relative; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--ok); }
      .led.off { background: var(--bad); }
      .led.on::after {
        content: ''; position: absolute; inset: 0; border-radius: 50%;
        background: var(--ok); animation: ripple 2.4s ease-out infinite;
      }
      @keyframes ripple { 0% { transform: scale(1); opacity: 0.5; } 75%, 100% { transform: scale(3); opacity: 0; } }

      .chead h3 { margin: 0; font-size: 14.5px; font-weight: 650; letter-spacing: 0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .tag {
        flex-shrink: 0; font-size: 11px; line-height: 1.4; padding: 1px 6px;
        border: 1px solid; border-radius: 4px; font-weight: 500;
      }
      .tag0 { color: var(--cpu);  border-color: color-mix(in srgb, var(--cpu) 40%, transparent); }
      .tag1 { color: var(--swap); border-color: color-mix(in srgb, var(--swap) 40%, transparent); }
      .tag2 { color: var(--mem);  border-color: color-mix(in srgb, var(--mem) 40%, transparent); }
      .tag-ok { color: var(--ok);  border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
      .tag-bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
      .chead .sp { flex: 1; }

      /* 卡片右上角 ? 弹层：正文装不下的次要信息 */
      .qwrap { position: relative; flex-shrink: 0; }
      .qbtn {
        display: grid; place-items: center; width: 18px; height: 18px;
        border: 1px solid var(--border2); border-radius: 50%;
        font: 700 10px/1 ui-monospace, Consolas, monospace;
        color: var(--faint); cursor: help; background: none; padding: 0;
      }
      .qbtn:hover { color: var(--text); border-color: var(--dim); }
      .qpop {
        position: absolute; right: 0; top: 26px; z-index: 30; width: 228px;
        background: var(--tip); border: 1px solid var(--border2); border-radius: 8px;
        padding: 10px 12px; box-shadow: 0 10px 28px rgba(2, 6, 12, 0.4);
        opacity: 0; visibility: hidden; transition: opacity 0.15s;
      }
      html:not(.dark) .qpop { box-shadow: 0 10px 28px rgba(30, 41, 59, 0.16); }
      .qwrap:hover .qpop { opacity: 1; visibility: visible; }
      .qpop dl { margin: 0; }
      .qpop .prow { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; font-size: 12px; }
      .qpop .prow dt { color: var(--faint); flex-shrink: 0; }
      .qpop .prow dd { margin: 0; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .qpop .prow.cut { border-top: 1px solid var(--border); margin-top: 4px; padding-top: 6px; }

      .cspec { margin: -4px 0 0; font-size: 11.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      /* ---------- 指标区：LED 分段仪表条 ---------- */
      .metric-area { display: flex; flex-direction: column; gap: 7px; }
      .mrow .mhead { display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px; }
      .mrow .mlabel { font-size: 11px; color: var(--dim); width: 52px; flex-shrink: 0; letter-spacing: 0.04em; }
      .mrow .mdetail { margin-left: auto; font-size: 11px; color: var(--faint); }
      .mrow .mpct { font-size: 12px; font-weight: 650; width: 46px; text-align: right; flex-shrink: 0; }

      .meter {
        height: 10px; border-radius: 3px; background: var(--track);
        overflow: hidden; display: block;
      }
      /* 分段：用 mask 在填充条上抠出等宽缺口，像 LED 电平表 */
      .meter i {
        display: block; height: 100%; width: 0; background: var(--c, var(--dim));
        -webkit-mask-image: repeating-linear-gradient(90deg, #000 0 5px, transparent 5px 7px);
        mask-image: repeating-linear-gradient(90deg, #000 0 5px, transparent 5px 7px);
      }
      .meter i.w { --c: var(--warn); }
      .meter i.b { --c: var(--bad); }
      .mrow .mpct.w { color: var(--warn); }
      .mrow .mpct.b { color: var(--bad); }
      .mrow .mdetail.w { color: var(--warn); }
      .mrow .mdetail.b { color: var(--bad); }
      .t-cpu { color: var(--cpu); } .t-mem { color: var(--mem); } .t-disk { color: var(--disk); }
      .t-swap { color: var(--swap); } .t-quo { color: var(--quo); } .t-up { color: var(--up); }
      .t-down { color: var(--down); } .t-warn { color: var(--warn); } .t-bad { color: var(--bad); }

      /* 迷你趋势：自绘 SVG，无依赖 */
      .spark { position: relative; border: 1px solid var(--border); border-radius: 6px; background: var(--panel2); overflow: hidden; }
      .spark svg { display: block; width: 100%; height: 40px; }
      .spark .slb {
        position: absolute; left: 8px; top: 5px; z-index: 2;
        font-size: 9.5px; letter-spacing: 0.14em; color: var(--faint); text-transform: uppercase;
        display: flex; align-items: center; gap: 5px;
      }
      .spark .slb i { width: 5px; height: 5px; border-radius: 50%; background: var(--cpu); animation: blink 2s steps(1) infinite; }
      .ncard.off .spark .slb i { animation: none; background: var(--faint); }

      /* 网速 / 累计 */
      .netrow { display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: baseline; }
      .netrow .cell { display: flex; align-items: baseline; gap: 7px; min-width: 0; }
      .netrow .nlb { font-size: 10.5px; letter-spacing: 0.1em; color: var(--faint); }
      .netrow b { font-size: 13px; font-weight: 600; }

      /* 三网延迟 + 负载 */
      .plrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; border-top: 1px solid var(--border); padding-top: 9px; }
      .plrow .sec {
        font-size: 10px; font-weight: 600; letter-spacing: 0.14em; color: var(--faint);
        text-transform: uppercase; margin-bottom: 5px; display: flex; align-items: center; gap: 5px;
      }
      .pingrow { display: flex; gap: 5px; flex-wrap: wrap; }
      .ping {
        display: inline-flex; align-items: baseline; gap: 4px;
        border: 1px solid var(--border2); border-radius: 5px; padding: 2px 6px;
        font-size: 11px; color: var(--faint);
      }
      .ping b { font-size: 12px; font-weight: 650; color: var(--pc, var(--text)); }
      .ping.to { border-color: color-mix(in srgb, var(--bad) 55%, transparent); }
      .ping.to b { color: var(--bad); }

      .loadval { font-size: 12.5px; }
      .loadval b { font-weight: 650; }
      .loadval .sep { color: var(--faint); margin: 0 3px; font-weight: 400; }

      /* 术语提示的小问号 */
      .qtip { position: relative; display: inline-grid; place-items: center; width: 14px; height: 14px; border-radius: 50%; background: var(--track); font: 700 9px/1 ui-monospace, Consolas, monospace; color: var(--dim); cursor: help; }
      .qtip .tt {
        position: absolute; right: 0; bottom: 20px; z-index: 40; width: 200px;
        background: var(--tip); border: 1px solid var(--border2); border-radius: 7px;
        padding: 8px 10px; font: 400 12px/1.55 system-ui, sans-serif; color: var(--dim);
        text-transform: none; letter-spacing: 0; opacity: 0; visibility: hidden; transition: opacity 0.15s;
        box-shadow: 0 10px 28px rgba(2, 6, 12, 0.4);
      }
      .qtip:hover .tt { opacity: 1; visibility: visible; }
      .qtip .tt b { color: var(--text); }

      /* 卡底：到期 + 在线时长 */
      .cfoot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 12px; border-top: 1px solid var(--border); padding-top: 9px; font-size: 11.5px; }
      .cfoot .lb { color: var(--faint); }
      .exp-pill { border-radius: 4px; padding: 1px 6px; font-weight: 600; font-size: 10.5px; }
      .exp-pill.gone { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
      .exp-pill.soon { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }

      /* ---------- 表格视图 ---------- */
      .tbl-panel { overflow: hidden; }
      .tbl-scroll { overflow-x: auto; }
      table.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
      .tbl thead th {
        position: sticky; top: 0;
        text-align: left; font-size: 10px; font-weight: 600; letter-spacing: 0.14em;
        text-transform: uppercase; color: var(--faint);
        padding: 9px 12px; background: var(--panel2);
        border-bottom: 1px solid var(--border); white-space: nowrap;
      }
      .tbl tbody td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; white-space: nowrap; }
      .tbl tbody tr:last-child td { border-bottom: 0; }
      .tbl tbody tr { cursor: pointer; transition: background 0.12s; }
      .tbl tbody tr:hover { background: var(--panel2); }
      .tbl tbody tr:hover td:first-child { box-shadow: inset 2px 0 0 var(--cpu); }
      .tbl tr.off { opacity: 0.5; }
      .nmcell { display: flex; align-items: center; gap: 7px; }
      .nmcell .n { font-weight: 600; font-size: 13px; }
      .tcell { min-width: 118px; }
      .tcell .rw { display: flex; align-items: center; gap: 7px; }
      .tcell .meter { flex: 1; height: 8px; }
      .tcell .pv { width: 36px; text-align: right; font-size: 11.5px; font-weight: 650; }
      .tcell .used { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--faint); margin-top: 2px; }
      .dim2 { color: var(--faint); font-size: 11px; }
      .b { font-weight: 650; }

      /* 列配置菜单 */
      .colwrap { position: relative; }
      .colmenu {
        position: absolute; right: 0; top: 38px; z-index: 30; width: 152px;
        background: var(--tip); border: 1px solid var(--border2); border-radius: 9px;
        padding: 5px; box-shadow: 0 12px 30px rgba(2, 6, 12, 0.4);
      }
      .colmenu label { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; font-size: 12.5px; cursor: pointer; }
      .colmenu label:hover { background: var(--panel2); }
      .colmenu input { accent-color: var(--cpu); width: 13px; height: 13px; margin: 0; }
      .colmenu .dis { color: var(--faint); cursor: default; }
      .hidden { display: none !important; }

      /* ---------- 页脚 ---------- */
      footer { max-width: 1560px; margin: 0 auto; width: 100%; padding: 10px 20px 26px; }
      .foot-in { border-top: 1px solid var(--border); padding-top: 12px; display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--faint); }

      /* 小屏 */
      @media (max-width: 1023px) {
        .topbar { padding: 0 14px; gap: 8px; }
        main { padding: 14px 14px 6px; }
        footer { padding: 10px 14px 22px; }
      }
      @media (max-width: 640px) {
        .plrow { grid-template-columns: 1fr; }
        .pt-title { display: none; }
      }

      @media (prefers-reduced-motion: reduce) {
        .bl { animation: none; }
        .led.on::after { animation: none; }
        .led.on::after { opacity: 0.25; transform: scale(1.8); }
        .ncard, .seg button, .ibtn { transition: none; }
      }

    </style>
  </head>
  <body>
    <div class="bg-layer" aria-hidden="true">
      <i class="bl bl-a"></i>
      <i class="bl bl-b"></i>
    </div>

    <!-- ============ 顶栏 ============ -->
      <div class="maincol">
        <header class="topbar">
          <span class="bmark sm" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path class="pw" d="M3 13.5h3.4l1.9-4.6 3.3 8.2 1.9-4.6H21"
                    stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="pt-title">Komari</span>
          <span class="tb-div"></span>
          <span class="pt-title">节点总览</span>
          <span class="refresh">每 5 秒自动刷新</span>
          <div style="flex: 1"></div>

          <div class="seg km-view-switch">
            <button data-view="grid" class="on">卡片</button>
            <button data-view="table">表格</button>
          </div>

      const mrow = (label, cls, p, detail, usedDetail) => {
        const off = p === null
        const tone = off ? '' : toneOf(p)
        return `
        <div class="mrow">
          <div class="mhead">
            <span class="mlabel">${label}</span>
            <span class="mdetail num ${tone}">${usedDetail || detail}</span>
            <span class="mpct num ${tone}">${off ? '—' : `${p.toFixed(0)}%`}</span>
          </div>
          <span class="meter"><i class="${tone}" style="width:${off ? 0 : Math.min(p, 100).toFixed(1)}%; --c: var(--${cls})"></i></span>
        </div>`
      }

      const pingChip = (ch, v, cls) =>
        v < 0
          ? `<span class="ping to">${ch} <b>×</b></span>`
          : `<span class="ping" style="--pc: var(--${cls})">${ch} <b class="num">${v}</b></span>`

      const card = (n) => {
        const memP = n.mem_total ? (n.mem / n.mem_total) * 100 : 0
        const diskP = n.disk_total ? (n.disk / n.disk_total) * 100 : 0
        const swapOn = n.swap_total > 0
        const swapP = swapOn ? (n.swap / n.swap_total) * 100 : null
        const used = usedTraffic(n)
        const quoP = n.limit ? (used / n.limit) * 100 : null
        const left = leftDays(n.expired)
        const expired = left !== null && left < 0

        return `
      <article class="panel ncard ${n.online ? '' : 'off'}" onclick="location.href='./mockup-console-detail.html'">

        <header class="chead">
          <span class="ident">
            ${flag(n.region)}
            ${osIcon(n.os)}
            <span class="led ${n.online ? 'on' : 'off'}"></span>
          </span>
          <h3>${n.name}</h3>
          ${tags(n.tags).map((t, i) => `<span class="tag tag${i % 3}">${t}</span>`).join('')}
          <span class="sp"></span>
          <div class="qwrap">
            <button class="qbtn" tabindex="-1">?</button>
            <div class="qpop">
              <dl>
                <div class="prow"><dt>CPU</dt><dd>${n.cpu_name}</dd></div>
                <div class="prow"><dt>架构</dt><dd class="num">${n.arch}</dd></div>
                <div class="prow"><dt>虚拟化</dt><dd>${n.virt}</dd></div>
                <div class="prow cut"><dt>进程数</dt><dd class="num">${n.proc}</dd></div>
                <div class="prow"><dt>连接数</dt><dd class="num">${n.conn}</dd></div>
              </dl>
            </div>
          </div>
        </header>

        <p class="cspec num">${n.os} · ${n.cores}核 · ${size(n.mem_total)} · ${size(n.disk_total)} · ${n.virt}</p>

        <div class="metric-area">
          ${mrow('CPU', 'cpu', n.cpu, '', `${(n.cores * n.cpu / 100).toFixed(1)} / ${n.cores} 核`)}
          ${mrow('内存', 'mem', memP, '', `${size(n.mem, true)} / ${size(n.mem_total, true)}`)}
          ${mrow('硬盘', 'disk', diskP, '', `${size(n.disk, true)} / ${size(n.disk_total, true)}`)}
          ${mrow('Swap', 'swap', swapP, '', swapOn ? `${size(n.swap, true)} / ${size(n.swap_total, true)}` : '未开启')}
          ${n.limit ? mrow('流量限额', 'quo', quoP, '', `${size(used, true)} / ${size(n.limit, true)}`) : ''}
        </div>

        <div class="spark">
          <span class="slb mono"><i></i>CPU · 60s</span>
          ${sparkSvg(n)}
        </div>

        <div class="netrow">
          <div class="cell">
            <span class="nlb">速率</span>
            <b class="num"><span class="t-up">&uarr;</span>${speed(n.net_out)}</b>
            <b class="num"><span class="t-down">&darr;</span>${speed(n.net_in)}</b>
          </div>
          <div class="cell">
            <span class="nlb">累计</span>
            <b class="num"><span class="t-up">&uarr;</span>${size(n.tx, true)}</b>
            <b class="num"><span class="t-down">&darr;</span>${size(n.rx, true)}</b>
          </div>
        </div>

        <div class="plrow">
          <div>
            <p class="sec">三网延迟 ms</p>
            <div class="pingrow">
              ${pingChip('电', n.ping.ct, 'cpu')}
              ${pingChip('联', n.ping.cu, 'mem')}
              ${pingChip('移', n.ping.cm, 'swap')}
            </div>
          </div>
          <div>
            <p class="sec">
              平均负载
              <span class="qtip">?
                <span class="tt">系统在 <b>1 / 5 / 15 分钟</b> 内的平均任务排队数。持续超过 CPU 核心数（本机 ${n.cores}）说明已经开始堵了。</span>
              </span>
            </p>
            <p class="num loadval">
              <b>${n.load.toFixed(2)}</b><span class="sep">/</span>${n.load5.toFixed(2)}<span class="sep">/</span>${n.load15.toFixed(2)}
            </p>
          </div>
        </div>

        <div class="cfoot num">
          <span>
            <span class="lb">到期 </span>${n.expired ? mdy(n.expired) : '永久'}
            ${expired
              ? `<span class="exp-pill gone">已过期 ${-left} 天</span>`
              : left !== null && left <= 14 ? `<span class="exp-pill soon">剩 ${left} 天</span>` : ''}
          </span>
          <span><span class="lb">在线 </span>${up(n.uptime)}</span>
        </div>
      </article>`
      }

      document.getElementById('view-grid').innerHTML = nodes.map(card).join('')

      /* ---------- 表格视图：列注册表，默认开 7 列 ---------- */
      const tc = (cls, p, usedTxt, totalTxt) => {
        const off = p === null
        const tone = off ? '' : toneOf(p)
        return `
        <div class="tcell">
          <div class="rw">
            <span class="meter"><i class="${tone}" style="width:${off ? 0 : Math.min(p, 100).toFixed(1)}%; --c: var(--${cls})"></i></span>
            <span class="pv num ${tone}">${off ? '—' : `${p.toFixed(0)}%`}</span>
          </div>
          <div class="used num"><span class="${tone}">${usedTxt}</span><span>${totalTxt}</span></div>
        </div>`
      }

      const COLUMNS = [
        { key:'name', label:'节点', on:true, cell:(n) => `
            <div class="nmcell">
              <span class="ident" style="display:flex;align-items:center;gap:6px">
                ${flag(n.region)}${osIcon(n.os)}
                <span class="led ${n.online ? 'on' : 'off'}"></span>
              </span>
              <span class="n">${n.name}</span>
            </div>` },
        { key:'spec', label:'配置', on:false, cell:(n) =>
            `<span class="dim2 num">${n.cores}核 ${size(n.mem_total, true)} ${size(n.disk_total, true)}</span>` },
        { key:'cpu', label:'CPU', on:true, cell:(n) =>
            tc('cpu', n.cpu, `${(n.cores * n.cpu / 100).toFixed(1)}核`, `${n.cores}核`) },
        { key:'mem', label:'内存', on:true, cell:(n) =>
            tc('mem', n.mem_total ? (n.mem / n.mem_total) * 100 : 0, size(n.mem, true), size(n.mem_total, true)) },
        { key:'disk', label:'硬盘', on:true, cell:(n) =>
            tc('disk', n.disk_total ? (n.disk / n.disk_total) * 100 : 0, size(n.disk, true), size(n.disk_total, true)) },
        { key:'swap', label:'Swap', on:false, cell:(n) => (n.swap_total > 0
            ? tc('swap', (n.swap / n.swap_total) * 100, size(n.swap, true), size(n.swap_total, true))
            : tc('swap', null, '未开启', '')) },
        { key:'net', label:'实时网速', on:true, cell:(n) => `
            <div class="num" style="font-size:12px">
              <span class="t-up">&uarr;</span> ${speed(n.net_out)}<br/>
              <span class="t-down">&darr;</span> ${speed(n.net_in)}
            </div>` },
        { key:'traffic', label:'总流量', on:true, cell:(n) => `
            <div class="num" style="font-size:12px">
              <span class="t-up">&uarr;</span> ${size(n.tx, true)}<br/>
              <span class="t-down">&darr;</span> ${size(n.rx, true)}
            </div>` },
        { key:'quota', label:'流量限额', on:false, cell:(n) => (n.limit
            ? tc('quo', (usedTraffic(n) / n.limit) * 100, size(usedTraffic(n), true), size(n.limit, true))
            : tc('quo', null, size(usedTraffic(n), true), '不限')) },
        { key:'load', label:'负载', on:false, cell:(n) => `
            <div class="num" style="font-size:12px">
              <b class="b" style="font-size:13px">${n.load.toFixed(2)}</b><br/>
              <span class="dim2">${n.load5.toFixed(2)} / ${n.load15.toFixed(2)}</span>
            </div>` },
        { key:'ping', label:'三网延迟', on:false, cell:(n) => `
            <div class="pingrow">
              ${pingChip('电', n.ping.ct, 'cpu')}
              ${pingChip('联', n.ping.cu, 'mem')}
              ${pingChip('移', n.ping.cm, 'swap')}
            </div>` },
        { key:'uptime', label:'在线', on:false, cell:(n) =>
            `<span class="num" style="font-size:12px">${up(n.uptime)}</span>` },
        { key:'expire', label:'到期', on:true, cell:(n) => {
            const left = leftDays(n.expired)
            const gone = left !== null && left < 0
            return `
            <div class="num" style="font-size:12px">
              <span class="${gone ? 't-bad' : ''}">${n.expired ? mdy(n.expired) : '永久'}</span><br/>
              <span class="${gone ? 't-bad b' : left !== null && left <= 14 ? 't-warn b' : 'dim2'}">
                ${left === null ? '—' : gone ? `已过期${-left}天` : `剩${left}天`}
              </span>
            </div>` } },
      ]
      const shown = () => COLUMNS.filter((c) => c.on)

      const renderTable = () => {
        document.getElementById('table-head').innerHTML = shown()
          .map((c) => `<th>${c.label}</th>`).join('')
        document.getElementById('table-body').innerHTML = nodes.map((n) => `
          <tr class="${n.online ? '' : 'off'}" onclick="location.href='./mockup-console-detail.html'">
            ${shown().map((c) => `<td>${c.cell(n)}</td>`).join('')}
          </tr>`).join('')
      }

      const renderColMenu = () => {
        document.getElementById('col-menu').innerHTML = COLUMNS.map((c) => `
          <label class="${c.key === 'name' ? 'dis' : ''}">
            <input type="checkbox" data-col="${c.key}" ${c.on ? 'checked' : ''} ${c.key === 'name' ? 'disabled' : ''} />
            <span>${c.label}</span>
          </label>`).join('')
        document.querySelectorAll('#col-menu input').forEach((box) => {
          box.onchange = () => {
            COLUMNS.find((c) => c.key === box.dataset.col).on = box.checked
            renderTable()
          }
        })
      }

      renderTable()
      renderColMenu()

      const colMenu = document.getElementById('col-menu')
      document.getElementById('col-btn').onclick = (e) => {
        e.stopPropagation()
        colMenu.classList.toggle('hidden')
      }
      document.addEventListener('click', () => colMenu.classList.add('hidden'))
      colMenu.onclick = (e) => e.stopPropagation()

      /* ---------- 视图切换 / 主题 / 时钟 ---------- */
      document.querySelectorAll('.km-view-switch button').forEach((btn) => {
        btn.onclick = () => {
          const grid = btn.dataset.view === 'grid'
          document.getElementById('view-grid').classList.toggle('hidden', !grid)
          document.getElementById('view-table').classList.toggle('hidden', grid)
          document.getElementById('col-wrap').classList.toggle('hidden', grid)
          colMenu.classList.add('hidden')
          document.querySelectorAll('.km-view-switch button').forEach((b) =>
            b.classList.toggle('on', b === btn))
        }
      })

      const syncThemeIcon = () => {
        const dark = document.documentElement.classList.contains('dark')
        document.querySelector('#theme-toggle .sun').classList.toggle('hidden', !dark)
        document.querySelector('#theme-toggle .moon').classList.toggle('hidden', dark)
      }
      document.getElementById('theme-toggle').onclick = () => {
        document.documentElement.classList.toggle('dark')
        try { localStorage.setItem('km-console-theme',
          document.documentElement.classList.contains('dark') ? 'dark' : 'light') } catch {}
        syncThemeIcon()
      }
      syncThemeIcon()

    </script>
  </body>
</html>
