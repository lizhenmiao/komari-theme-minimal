<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>风格样张 / Vercel · Linear</title>
    <script>
      try {
        const q = new URLSearchParams(location.search).get('theme')
        if ((q || localStorage.getItem('km-style-vercel')) === 'light')
          document.documentElement.classList.remove('dark')
      } catch {}
    </script>
    <style>
      /* ============================================================
       * 风格样张：Vercel / Linear
       * 黑白灰为主，极细描边，大标题紧字距，白色曲线 + 渐隐面积。
       * 颜色只在出问题时出现（红 / 琥珀），平时整页只有灰阶。
       * ============================================================ */
      @font-face {
        font-family: 'Inter';
        src: url('fonts/inter-latin-wght-normal.woff2') format('woff2-variations');
        font-weight: 100 900;
        font-display: swap;
      }
      :root {
        --bg: #ffffff;
        --bg2: #fafafa;
        --line: #eaeaea;
        --line2: #d4d4d4;
        --text: #171717;
        --muted: #5f5f5f;
        --faint: #737373;
        --chart: #171717;
        --red: #cb2a2f;
        --red-bg: #fdecec;
        --amber: #9a5b00;
        --amber-bg: #fff4e0;
        --green: #1a7f37;
        --shadow: 0 1px 2px rgb(0 0 0 / 0.04);
        color-scheme: light;
      }
      .dark {
        --bg: #000000;
        --bg2: #0a0a0a;
        --line: #232323;
        --line2: #3a3a3a;
        --text: #ededed;
        --muted: #a1a1a1;
        --faint: #8f8f8f;
        --chart: #ededed;
        --red: #ff6166;
        --red-bg: rgb(255 97 102 / 0.12);
        --amber: #f5b03e;
        --amber-bg: rgb(245 176 62 / 0.12);
        --green: #45c46b;
        --shadow: none;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 'Inter', system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        -webkit-font-smoothing: antialiased;
        padding-bottom: 90px;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--text);
        outline-offset: 2px;
        border-radius: 6px;
      }
      .num {
        font-variant-numeric: tabular-nums;
        font-feature-settings: 'tnum', 'cv11';
      }
      .wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 24px;
      }

      /* ---------- 顶栏 + 标签页 ---------- */
      .nav {
        position: sticky;
        top: 0;
        z-index: 10;
        background: color-mix(in srgb, var(--bg) 85%, transparent);
        backdrop-filter: saturate(180%) blur(12px);
        border-bottom: 1px solid var(--line);
      }
      .nav-in {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 60px;
      }
      .crumb {
        font-weight: 500;
      }
      .sep {
        color: var(--line2);
        font-size: 22px;
        font-weight: 200;
        margin: 0 -2px;
      }
      .tag {
        padding: 2px 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        font-size: 12px;
      }
      .nav-r {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 30px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        font-size: 13px;
        color: var(--muted);
      }
      .pill i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--green);
      }
      .pill.bad i {
        background: var(--red);
        box-shadow: 0 0 0 3px var(--red-bg);
      }
      .icon-btn {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: none;
        color: var(--muted);
        cursor: pointer;
      }
      .icon-btn:hover {
        color: var(--text);
        border-color: var(--line2);
      }
      .avatar {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: linear-gradient(135deg, #7928ca, #ff0080);
      }
      .tabs {
        display: flex;
        gap: 4px;
        margin-bottom: -1px;
        overflow-x: auto;
      }
      .tabs a {
        padding: 10px 10px 12px;
        color: var(--muted);
        font-size: 14px;
        border-bottom: 2px solid transparent;
        white-space: nowrap;
      }
      .tabs a:hover {
        color: var(--text);
      }
      .tabs a[aria-current] {
        color: var(--text);
        border-bottom-color: var(--text);
      }

      /* ---------- 标题 ---------- */
      .head {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 16px;
        padding: 40px 0 28px;
      }
      h1 {
        margin: 0;
        font-size: 32px;
        line-height: 1.15;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .head p {
        margin: 6px 0 0;
        color: var(--muted);
      }
      .filter {
        margin-left: auto;
        display: inline-flex;
        flex-wrap: wrap;
        gap: 2px;
        padding: 3px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--bg2);
      }
      .filter button {
        height: 30px;
        padding: 0 12px;
        border: 0;
        border-radius: 7px;
        background: none;
        color: var(--muted);
        cursor: pointer;
        font-size: 13px;
      }
      .filter button:hover {
        color: var(--text);
      }
      .filter button[aria-pressed='true'] {
        background: var(--bg);
        color: var(--text);
        box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgb(0 0 0 / 0.08);
      }

      /* ---------- 指标条 ---------- */
      .kpis {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--bg2);
        box-shadow: var(--shadow);
      }
      .kpi {
        padding: 20px 22px;
        border-left: 1px solid var(--line);
      }
      .kpi:first-child {
        border-left: 0;
      }
      .kpi .lb {
        color: var(--muted);
        font-size: 13px;
      }
      .kpi .v {
        margin-top: 6px;
        font-size: 28px;
        line-height: 1.2;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
      .kpi .v small {
        font-size: 15px;
        font-weight: 500;
        color: var(--muted);
        margin-left: 3px;
        letter-spacing: 0;
      }
      .kpi .ft {
        margin-top: 4px;
        color: var(--faint);
        font-size: 13px;
      }

      /* ---------- 区块 ---------- */
      .sec-h {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin: 44px 0 14px;
      }
      .sec-h h2 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .sec-h span {
        color: var(--faint);
        font-size: 14px;
      }
      .search {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
        width: 240px;
        height: 34px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        color: var(--faint);
      }
      .search input {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: 0;
        background: none;
        color: var(--text);
        font: inherit;
        font-size: 13px;
      }
      .search kbd {
        padding: 0 5px;
        border: 1px solid var(--line);
        border-radius: 4px;
        font: 11px/18px inherit;
        color: var(--faint);
      }

      /* 需要注意：Linear 式列表 */
      .list {
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      .row {
        display: grid;
        grid-template-columns: 10px minmax(0, 200px) minmax(0, 1fr) auto 16px;
        align-items: center;
        gap: 14px;
        height: 50px;
        padding: 0 18px;
        border-top: 1px solid var(--line);
        background: var(--bg2);
      }
      .row:first-child {
        border-top: 0;
      }
      .row:hover {
        background: var(--bg);
      }
      .row i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--red);
      }
      .row.warm i {
        background: var(--amber);
      }
      .row .nm {
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row .why {
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row .grp {
        color: var(--faint);
        font-size: 13px;
      }
      .row svg {
        color: var(--faint);
      }

      /* 节点卡片 */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(360px, 100%), 1fr));
        gap: 16px;
      }
      .card {
        display: block;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--bg2);
        box-shadow: var(--shadow);
        transition: border-color 0.15s;
        overflow: hidden;
      }
      .card:hover {
        border-color: var(--line2);
      }
      .c-top {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 18px 0;
      }
      .flag {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        object-fit: cover;
        flex: none;
        box-shadow: 0 0 0 1px var(--line);
      }
      .region-text {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 1px solid var(--line);
        font-size: 11px;
        color: var(--muted);
        flex: none;
      }
      .c-name {
        font-weight: 600;
        letter-spacing: -0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .c-meta {
        color: var(--faint);
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .c-top > div {
        min-width: 0;
      }
      .state {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
      }
      .state i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--green);
      }
      .state.off i {
        background: var(--red);
      }
      .badge {
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
      }
      .badge.hot {
        color: var(--red);
        background: var(--red-bg);
      }
      .badge.warm {
        color: var(--amber);
        background: var(--amber-bg);
      }
      .c-chart {
        margin: 14px 0 0;
      }
      .c-chart svg {
        display: block;
        width: 100%;
        height: 56px;
      }
      .c-chart .cap {
        padding: 0 18px 4px;
        font-size: 12px;
        color: var(--faint);
      }
      .c-chart .cap b {
        display: block;
        color: var(--text);
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 1.2;
      }
      .c-chart .cap b.hot {
        color: var(--red);
      }
      .c-chart .cap b.warm {
        color: var(--amber);
      }
      .gap {
        display: inline-block;
        width: 10px;
      }
      .t-faint {
        color: var(--faint);
      }
      .c-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 10px 18px 0;
      }
      .tag2 {
        padding: 1px 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        font-size: 12px;
      }
      .c-chart .cap {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
      }
      .c-chart .load {
        color: var(--faint);
        font-size: 12px;
        padding-bottom: 3px;
      }
      .c-chart .cap .load b {
        display: inline;
        color: var(--muted);
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0;
        white-space: pre;
      }
      .c-meters {
        display: grid;
        gap: 9px;
        padding: 14px 18px;
        border-top: 1px solid var(--line);
      }
      .m {
        display: grid;
        grid-template-columns: 36px 38px minmax(40px, 1fr) auto;
        align-items: center;
        gap: 10px;
        font-size: 13px;
      }
      .m-l {
        color: var(--muted);
      }
      .m-v {
        font-weight: 600;
        text-align: right;
      }
      .m-bar {
        height: 4px;
        border-radius: 2px;
        background: var(--line);
        overflow: hidden;
      }
      .m-bar i {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: var(--muted);
        transition: width 0.5s ease;
      }
      .m-bar i.warm {
        background: var(--amber);
      }
      .m-bar i.hot {
        background: var(--red);
      }
      .m-d {
        color: var(--faint);
        font-size: 12px;
        white-space: nowrap;
        text-align: right;
      }
      .m-v.hot,
      .c-kv .hot {
        color: var(--red);
      }
      .m-v.warm,
      .c-kv .warm {
        color: var(--amber);
      }
      .c-kv {
        margin: 0;
        padding: 4px 18px 6px;
        border-top: 1px solid var(--line);
      }
      .c-kv div {
        display: flex;
        align-items: baseline;
        gap: 12px;
        padding: 7px 0;
        min-width: 0;
      }
      .c-kv div + div {
        border-top: 1px dashed var(--line);
      }
      .c-kv dt {
        flex: none;
        color: var(--faint);
        font-size: 13px;
      }
      .c-kv dd {
        margin: 0 0 0 auto;
        font-size: 13px;
        font-weight: 500;
        text-align: right;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .c-kv dd b {
        font-weight: 600;
      }
      .card.off .c-chart,
      .card.off .c-meters,
      .card.off .c-kv {
        opacity: 0.45;
      }

      /* 视图切换 */
      .views {
        display: inline-flex;
        gap: 2px;
        padding: 3px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--bg2);
      }
      .views button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding: 0 10px;
        border: 0;
        border-radius: 7px;
        background: none;
        color: var(--muted);
        cursor: pointer;
        font-size: 13px;
      }
      .views button[aria-pressed='true'] {
        background: var(--bg);
        color: var(--text);
        box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgb(0 0 0 / 0.08);
      }
      /* 表格 */
      .tablewrap {
        overflow-x: auto;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--bg2);
      }
      table.t {
        width: 100%;
        min-width: 980px;
        border-collapse: collapse;
        font-size: 13px;
        font-feature-settings: 'tnum', 'cv11';
      }
      .t th {
        padding: 11px 10px;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
        text-align: left;
        white-space: nowrap;
      }
      .t td {
        padding: 10px 10px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
        vertical-align: middle;
        line-height: 1.45;
      }
      .t tr:last-child td {
        border-bottom: 0;
      }
      .t tbody tr:hover td {
        background: var(--bg);
      }
      .t .hot {
        color: var(--red);
      }
      .t .warm {
        color: var(--amber);
      }
      .t-who b {
        font-weight: 500;
      }
      .t-who span {
        color: var(--faint);
        font-size: 12px;
      }
      .t-state {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: var(--muted);
      }
      .t-state i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--green);
      }
      .t-state.off i,
      .t-state.hot i {
        background: var(--red);
      }
      .t-state.warm i {
        background: var(--amber);
      }
      .t-state.off,
      .t-state.hot {
        color: var(--red);
      }
      .t-state.warm {
        color: var(--amber);
      }
      .t-bar {
        height: 4px;
        border-radius: 2px;
        background: var(--line);
      }
      .t-bar i {
        background: var(--muted);
      }
      .t-bar i.warm {
        background: var(--amber);
      }
      .t-bar i.hot {
        background: var(--red);
      }

      .t tbody tr {
        cursor: pointer;
      }
      .t .r {
        text-align: right;
      }
      .t-who {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .t-who .flag,
      .t-who .region-text {
        width: 26px;
        height: 26px;
      }
      .t-who b {
        display: block;
      }
      .t-m {
        display: grid;
        grid-template-columns: 36px 44px;
        align-items: center;
        gap: 8px;
      }
      .t-m b {
        font-weight: 600;
        text-align: right;
      }
      .t-bar {
        display: block;
        overflow: hidden;
      }
      .t-bar i {
        display: block;
        height: 100%;
        border-radius: inherit;
      }

      @media (max-width: 860px) {
        .kpis {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .kpi:nth-child(3) {
          border-left: 0;
        }
        .kpi:nth-child(n + 3) {
          border-top: 1px solid var(--line);
        }
        .filter {
          margin-left: 0;
        }
        .search {
          display: none;
        }
        .views {
          margin-left: auto;
        }
        .row {
          grid-template-columns: 10px minmax(0, 1fr) auto;
        }
        .row .grp,
        .row svg {
          display: none;
        }
        .row .why {
          grid-column: 2 / -1;
          grid-row: 2;
          margin-top: -14px;
        }
        .row {
          height: auto;
          padding: 12px 16px;
          row-gap: 14px;
        }
      }
      @media (max-width: 520px) {
        .wrap {
          padding: 0 16px;
        }
        .tag,
        .pill span {
          display: none;
        }
        h1 {
          font-size: 26px;
        }
        .kpi {
          padding: 16px;
        }
        .kpi .v {
          font-size: 22px;
        }
      }
    </style>
  </head>
  <body>
    <header class="nav">
      <div class="wrap nav-in">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <rect width="24" height="24" rx="6" fill="currentColor" />
          <path d="M6 15.5 10 11l3 3 5-6" fill="none" stroke="var(--bg)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="sep">/</span>
        <span class="crumb">Komari Mock</span>
        <span class="tag">公开</span>
        <div class="nav-r">
          <span class="pill" id="pill"></span>
          <button type="button" class="icon-btn" id="theme" aria-label="切换外观"></button>
          <span class="avatar" aria-hidden="true"></span>
        </div>
      </div>
      <nav class="wrap tabs" aria-label="页面">
        <a href="#" aria-current="page">总览</a><a href="#">节点</a><a href="#">延迟</a><a href="#">流量</a>
      </nav>
    </header>

    <main class="wrap">
      <div class="head">
        <div>
          <h1>总览</h1>
          <p id="sub"></p>
        </div>
        <div class="filter" id="filter" role="group" aria-label="分组"></div>
      </div>

      <section class="kpis num" id="kpis" aria-label="关键指标"></section>

      <div class="sec-h"><h2>需要注意</h2><span id="att-n"></span></div>
      <section class="list" id="att"></section>

      <div class="sec-h">
        <h2>节点</h2>
        <span id="node-n"></span>
        <label class="search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-4-4" /></svg>
          <input id="q" placeholder="搜索节点" aria-label="搜索节点" />
          <kbd>/</kbd>
        </label>
        <div class="views" id="views" role="group" aria-label="视图"><button type="button" data-v="grid"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>卡片</button><button type="button" data-v="table"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3.5 6h17M3.5 12h17M3.5 18h17"/></svg>表格</button></div>
      </div>
      <section class="grid" id="grid"></section>
      <section class="tablewrap" id="tbl" hidden></section>
    </main>

    <script src="data.js"></script>
    <script src="core.js"></script>
    <script>
      ;(function () {
        'use strict'
        const R = window.RACK
        const { NODES, PING_TASKS, esc } = R
        let group = ''
        let query = ''

        // ---------- 外观 ----------
        const SUN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
        const MOON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>'
        const themeBtn = document.getElementById('theme')
        const syncTheme = () => (themeBtn.innerHTML = document.documentElement.classList.contains('dark') ? SUN : MOON)
        themeBtn.addEventListener('click', () => {
          const d = document.documentElement.classList.toggle('dark')
          localStorage.setItem('km-style-vercel', d ? 'dark' : 'light')
          syncTheme()
        })
        syncTheme()

        // ---------- CPU 近 2 分钟 ----------
        const hist = new Map()
        const now0 = Date.now() / 1000
        for (const n of NODES) {
          const a = []
          for (let i = 59; i >= 0; i--) a.push(R.live(n, now0 - i * 2).cpu)
          hist.set(n.uuid, a)
        }

        /** Catmull-Rom 转三次贝塞尔：Vercel Analytics 那种圆润曲线。 */
        function smooth(pts) {
          let d = `M${pts[0][0]},${pts[0][1]}`
          for (let i = 0; i < pts.length - 1; i++) {
            const p0 = pts[i - 1] || pts[i]
            const p1 = pts[i]
            const p2 = pts[i + 1]
            const p3 = pts[i + 2] || p2
            const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6]
            const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6]
            d += `C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`
          }
          return d
        }
        function chart(n, v) {
          const W = 400
          const H = 56
          const a = hist.get(n.uuid)
          if (!v.online) return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><line x1="0" x2="${W}" y1="${H - 1}" y2="${H - 1}" stroke="var(--line2)" stroke-dasharray="3 4"/></svg>`
          const pts = a.map((p, i) => [(i / (a.length - 1)) * W, H - 3 - (p / 100) * (H - 8)])
          const line = smooth(pts)
          const c = v.cpu >= R.HOT_AT ? 'var(--red)' : v.cpu >= R.WARN_AT ? 'var(--amber)' : 'var(--chart)'
          const id = 'g' + n.uuid
          return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
            <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${c};stop-opacity:.18"/><stop offset="1" style="stop-color:${c};stop-opacity:0"/></linearGradient></defs>
            <path d="${line}L${W},${H}L0,${H}Z" fill="url(#${id})"/>
            <path d="${line}" fill="none" style="stroke:${c}" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
          </svg>`
        }

        const lvCls = (p) => (p >= R.HOT_AT ? 'hot' : p >= R.WARN_AT ? 'warm' : '')
        const groups = [...new Set(NODES.map((n) => n.group).filter(Boolean))]
        const filterEl = document.getElementById('filter')
        filterEl.innerHTML = ['', ...groups].map((g) => `<button type="button" data-g="${esc(g)}" aria-pressed="${g === group}">${esc(g || '全部')}</button>`).join('')
        filterEl.addEventListener('click', (e) => {
          const b = e.target.closest('button')
          if (!b) return
          group = b.dataset.g
          for (const x of filterEl.children) x.setAttribute('aria-pressed', String(x.dataset.g === group))
          render()
        })
        document.getElementById('q').addEventListener('input', (e) => {
          query = e.target.value.trim().toLowerCase()
          render()
        })
        addEventListener('keydown', (e) => {
          if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
            e.preventDefault()
            document.getElementById('q').focus()
          }
        })


        // ---------- 卡片 / 表格 ----------
        const VIEW_KEY = 'km-style-view'
        let view = localStorage.getItem(VIEW_KEY) || 'grid'
        const viewsEl = document.getElementById('views')
        const syncView = () => {
          for (const b of viewsEl.children) b.setAttribute('aria-pressed', String(b.dataset.v === view))
          document.getElementById('grid').hidden = view !== 'grid'
          document.getElementById('tbl').hidden = view !== 'table'
        }
        viewsEl.addEventListener('click', (e) => {
          const b = e.target.closest('[data-v]')
          if (!b) return
          view = b.dataset.v
          localStorage.setItem(VIEW_KEY, view)
          syncView()
          render()
        })
        window.CORE.bindTable(document.getElementById('tbl'))

        function render() {
          const now = Date.now() / 1000
          const vals = new Map(NODES.map((n) => [n.uuid, R.live(n, now)]))
          for (const n of NODES) {
            const h = hist.get(n.uuid)
            h.push(vals.get(n.uuid).cpu)
            h.shift()
          }
          const on = NODES.filter((n) => vals.get(n.uuid).online)
          let up = 0
          let down = 0
          let tu = 0
          let td = 0
          let cpu = 0
          for (const n of NODES) {
            const v = vals.get(n.uuid)
            up += v.up
            down += v.down
            tu += v.total.up
            td += v.total.down
            if (v.online) cpu += v.cpu
          }
          const att = []
          for (const n of NODES) {
            const list = R.issues(n, vals.get(n.uuid)).filter((i) => !i.minor)
            if (list.length) att.push({ n, lv: list.some((i) => i.lv === 'hot') ? 'hot' : 'warm', why: list.map((i) => i.short).join('，') })
          }
          att.sort((a, b) => (a.lv === b.lv ? 0 : a.lv === 'hot' ? -1 : 1))

          const pill = document.getElementById('pill')
          pill.className = 'pill' + (att.length ? ' bad' : '')
          pill.innerHTML = `<i></i><span>${att.length ? `${att.length} 台需要注意` : '全部正常'}</span>`
          document.getElementById('sub').textContent = `${NODES.length} 台节点，分布在 ${groups.length} 个分组，每 2 秒刷新。`

          const unit = (b, s = '') => {
            const [x, u] = R.fmtBytes(b)
            return `${x}<small>${u}B${s}</small>`
          }
          document.getElementById('kpis').innerHTML = `
            <div class="kpi"><div class="lb">在线节点</div><div class="v">${on.length}<small>/ ${NODES.length}</small></div><div class="ft">${NODES.length - on.length} 台离线</div></div>
            <div class="kpi"><div class="lb">实时下行</div><div class="v">${unit(down, '/s')}</div><div class="ft">上行 ${R.bytesText(up, 'B/s')}</div></div>
            <div class="kpi"><div class="lb">累计下行</div><div class="v">${unit(td)}</div><div class="ft">上行 ${R.bytesText(tu, 'B')}</div></div>
            <div class="kpi"><div class="lb">平均 CPU</div><div class="v">${Math.round(cpu / on.length)}<small>%</small></div><div class="ft">按在线节点计算</div></div>`

          document.getElementById('att-n').textContent = att.length
          const chev = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>'
          document.getElementById('att').innerHTML = att
            .map((a) => `<a class="row ${a.lv}" href="vercel-detail.html?id=${a.n.uuid}"><i></i><span class="nm">${esc(a.n.name)}</span><span class="why">${esc(a.why)}</span><span class="grp">${esc(a.n.group || '未分组')}</span>${chev}</a>`)
            .join('')

          const shown = NODES.filter((n) => (!group || n.group === group) && (!query || n.name.toLowerCase().includes(query)))
          document.getElementById('node-n').textContent = shown.length
          if (view === 'table') document.getElementById('tbl').innerHTML = window.CORE.table(shown, vals, 'vercel-detail.html')
          document.getElementById('grid').innerHTML = shown
            .map((n) => {
              const v = vals.get(n.uuid)
              const list = R.issues(n, v).filter((i) => !i.minor)
              const pct = (p) => (p == null ? '—' : Math.round(p) + '%')
              const B = (b) => R.bytesText(b, 'B')
              const state = v.online
                ? `<span class="state"><i></i>${R.fmtDur(v.uptime, true)}</span>`
                : `<span class="state off"><i></i>离线 ${R.fmtDur(v.offlineFor, true)}</span>`
              const badges = v.online ? list.map((i) => `<span class="badge ${i.lv}">${esc(i.short)}</span>`).join('') : ''

              // 资源行：名称、百分比、细条、已用 / 总量
              const meter = (label, p, used, total) => `<div class="m">
                  <span class="m-l">${label}</span><b class="m-v ${lvCls(p)}">${pct(p)}</b>
                  <div class="m-bar"><i class="${lvCls(p)}" style="width:${Math.min(100, p ?? 0)}%"></i></div>
                  <span class="m-d">${p == null ? '—' : `${B(used)} / ${B(total)}`}</span></div>`
              const q = R.quotaPct(n, v)
              const meters = [
                meter('内存', v.mem, (n.mem * (v.mem ?? 0)) / 100, n.mem),
                meter('磁盘', v.disk, (n.disk * v.disk) / 100, n.disk),
                n.swap ? meter('Swap', v.swap, (n.swap * (v.swap ?? 0)) / 100, n.swap) : '',
                q != null ? meter('配额', q, R.quotaUsed(n, v), n.limit) : '',
              ].join('')

              const ids = Object.keys(n.ping)
              const ping = !ids.length
                ? '<span class="t-faint">未配置</span>'
                : !v.online
                  ? '—'
                  : ids
                      .map((k) => {
                        const ms = v.ping[k]
                        const c = R.pingCls(ms, v.loss[k])
                        return `${esc(PING_TASKS.find((t) => t.id === +k).name)} <b class="${c === 't-hot' ? 'hot' : c === 't-warm' ? 'warm' : ''}">${Math.round(ms)}</b>`
                      })
                      .join('<span class="gap"></span>')
              const ex = R.expiryText(n)
              const dl = R.daysLeft(n)
              const exp = dl == null ? '长期' : `${R.fmtDate(n.expires)}<span class="t-faint">，${dl < 0 ? `过期 ${-dl} 天` : `剩 ${dl} 天`}</span>`

              return `<a class="card${v.online ? '' : ' off'}" href="vercel-detail.html?id=${n.uuid}">
                <div class="c-top">${R.flag(n.region)}<div><div class="c-name">${esc(n.name)}</div>
                  <div class="c-meta">${esc(n.os)}<span class="gap"></span>${n.cores} 核<span class="gap"></span>${B(n.mem)}<span class="gap"></span>${B(n.disk)}</div></div>${state}</div>
                ${badges || n.tags.length ? `<div class="c-tags">${badges}${n.tags.map((t) => `<span class="tag2">${esc(t)}</span>`).join('')}</div>` : ''}
                <div class="c-chart">
                  <div class="cap"><span>CPU<b class="num ${lvCls(v.cpu)}">${pct(v.cpu)}</b></span>
                    <span class="load num">负载 <b>${v.online ? v.load.map((x) => x.toFixed(2)).join('  ') : '—'}</b></span></div>
                  ${chart(n, v)}
                </div>
                <div class="c-meters num">${meters}</div>
                <dl class="c-kv num">
                  <div><dt>网速</dt><dd>${v.online ? `↓ ${R.bytesText(v.down, 'B/s')}<span class="gap"></span>↑ ${R.bytesText(v.up, 'B/s')}` : '—'}</dd></div>
                  <div><dt>累计流量</dt><dd>↓ ${B(v.total.down)}<span class="gap"></span>↑ ${B(v.total.up)}</dd></div>
                  <div><dt>延迟</dt><dd>${ping}${v.online && ids.length ? ' <span class="t-faint">ms</span>' : ''}</dd></div>
                  <div><dt>到期</dt><dd class="${ex.cls === 't-hot' ? 'hot' : ex.cls === 't-warm' ? 'warm' : ''}">${exp}</dd></div>
                </dl>
              </a>`
            })
            .join('')
        }

        syncView()
        render()
        setInterval(() => document.hidden || render(), 2000)
      })()
    </script>
    <script src="switcher.js"></script>
  </body>
</html>
