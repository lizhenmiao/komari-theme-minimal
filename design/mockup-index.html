<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>minimal - 设计稿 / 首页</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @custom-variant dark (&:where(.dark, .dark *));
      :root { color-scheme: light; }
      :root:is(.dark) { color-scheme: dark; }
      body {
        @apply bg-slate-100 text-slate-800 antialiased
               dark:bg-slate-950 dark:text-slate-100;
      }

      /* 半透明 + 背板模糊，让背景光带透一点上来 */
      .card {
        @apply rounded-xl border border-white/70 bg-white/75 backdrop-blur-xl
               shadow-[0_1px_2px_rgb(15_23_42/0.04)]
               dark:border-slate-700/50 dark:bg-slate-900/70;
      }
      /* 只有可点的节点卡才有悬停反馈 */
      .card-i {
        @apply cursor-pointer transition duration-150
               hover:border-slate-300 hover:shadow-[0_4px_16px_rgb(15_23_42/0.08)]
               dark:hover:border-slate-700;
      }

      .lb { @apply text-[12px] font-medium text-slate-400 dark:text-slate-500; }
      .num { @apply font-mono tabular-nums; }
      .chip {
        @apply rounded px-1.5 py-0.5 text-[12px] font-medium leading-[1.4];
      }
      .pill {
        @apply inline-flex items-baseline gap-1 rounded-full px-2 py-0.5
               text-[12px] font-medium leading-[1.5];
      }
      /* 区块小标题 */
      .sec {
        @apply text-[11px] font-semibold uppercase tracking-wider
               text-slate-400 dark:text-slate-500;
      }
      .track {
        @apply h-[6px] overflow-hidden rounded-full bg-slate-100 dark:bg-slate-800;
      }
      .bar { @apply h-full rounded-full transition-[width] duration-500; }
      .hair { @apply border-slate-100 dark:border-slate-800; }
      /* 每个指标一个色系 */
      .f-cpu  { @apply bg-gradient-to-r from-indigo-400 to-indigo-500; }
      .f-mem  { @apply bg-gradient-to-r from-violet-400 to-violet-500; }
      .f-disk { @apply bg-gradient-to-r from-amber-400 to-amber-500; }
      .f-swap { @apply bg-gradient-to-r from-teal-400 to-teal-500; }
      .f-quo  { @apply bg-gradient-to-r from-sky-400 to-sky-500; }
      .f-warn { @apply bg-gradient-to-r from-amber-400 to-orange-500; }
      .f-bad  { @apply bg-gradient-to-r from-rose-400 to-rose-500; }
      .t-cpu  { @apply text-indigo-500 dark:text-indigo-400; }
      .t-mem  { @apply text-violet-500 dark:text-violet-400; }
      .t-disk { @apply text-amber-600 dark:text-amber-400; }
      .t-swap { @apply text-teal-600 dark:text-teal-400; }
      .t-quo  { @apply text-sky-600 dark:text-sky-400; }
      .t-warn { @apply text-orange-500 dark:text-orange-400; }
      .t-bad  { @apply text-rose-500 dark:text-rose-400; }

      .seg {
        @apply flex items-center gap-0.5 rounded-lg bg-slate-200/70 p-0.5
               dark:bg-slate-800;
      }
      .seg-on {
        @apply rounded-md bg-white px-3 py-1 text-[13px] font-medium text-slate-800
               shadow-sm dark:bg-slate-700 dark:text-slate-100;
      }
      .seg-off {
        @apply rounded-md px-3 py-1 text-[13px] font-medium text-slate-500
               hover:text-slate-700 dark:hover:text-slate-300;
      }
      .iconbtn {
        @apply grid size-9 place-items-center rounded-lg text-slate-500 transition
               hover:bg-slate-200/70 hover:text-slate-900
               dark:hover:bg-slate-800 dark:hover:text-slate-100;
      }
      /* 卡片右上角的 ? ：放正文挤不下的次要信息 */
      .qmark {
        @apply grid size-4.5 place-items-center rounded-full bg-slate-100
               text-[11px] font-semibold text-slate-400 transition
               hover:bg-slate-200 hover:text-slate-600
               dark:bg-slate-800 dark:hover:bg-slate-700 dark:hover:text-slate-200;
      }
      .pop {
        @apply invisible absolute right-0 top-6 z-30 w-56 rounded-xl border
               border-slate-200 bg-white p-3 opacity-0 shadow-xl
               transition duration-150
               dark:border-slate-700 dark:bg-slate-800;
      }
      .group\/pop:hover .pop { @apply visible opacity-100; }
      .prow { @apply flex items-baseline justify-between gap-3 py-[2px] text-[12px]; }
      .prow dt { @apply shrink-0 text-slate-400 dark:text-slate-500; }
      .prow dd { @apply truncate text-right; }

      /* 术语解释用的小问号，挂在区块标题后面 */
      .qmark-sm {
        @apply inline-grid size-3.5 shrink-0 translate-y-px place-items-center
               rounded-full bg-slate-200/80 text-[9px] font-bold not-italic
               normal-case tracking-normal text-slate-500 transition
               hover:bg-slate-300 hover:text-slate-700
               dark:bg-slate-700 dark:text-slate-400
               dark:hover:bg-slate-600 dark:hover:text-slate-200;
      }
      /* 比 .pop 窄，右对齐避免溢出卡片。显式重置 .sec 继承来的大写和字距 */
      .tip {
        @apply invisible absolute right-0 top-5 z-40 w-52 rounded-lg border
               border-slate-200 bg-white p-2.5 text-[12px] font-normal normal-case
               leading-relaxed tracking-normal text-slate-600 opacity-0 shadow-xl
               transition duration-150
               dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300;
      }
      .group\/tip:hover .tip { @apply visible opacity-100; }
      /*
       * 背景层：顶部一条极淡的光带 + 细网格线。
       * 卡片区域基本是干净底色，装饰只留在上沿。
       * fixed + -z-10 + pointer-events-none，滚动不动、不挡点击。
       */
      .bg-layer { @apply pointer-events-none fixed inset-0 -z-10 overflow-hidden; }
      .aurora {
        @apply absolute left-1/2 top-[-34vh] h-[58vh] w-[150vw] -translate-x-1/2
               blur-[70px] opacity-[0.22] dark:opacity-[0.16];
        background: linear-gradient(
          100deg,
          transparent 8%,
          #6366f1 26%,
          #a855f7 44%,
          #14b8a6 62%,
          transparent 88%
        );
        animation: sway 28s ease-in-out infinite;
      }
      .grid-lines {
        @apply absolute inset-0 text-slate-400/20 dark:text-slate-500/10;
        background-image:
          linear-gradient(to right, currentColor 1px, transparent 1px),
          linear-gradient(to bottom, currentColor 1px, transparent 1px);
        background-size: 34px 34px;
        -webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 55%);
        mask-image: linear-gradient(to bottom, #000 0%, transparent 55%);
      }
      /* 幅度很小，只是让光带不完全静止 */
      @keyframes sway {
        0%, 100% { transform: translate(-50%, 0); }
        50%      { transform: translate(-46%, 2.5vh); }
      }

      /*
       * 在线状态点：水波纹呼吸。
       * 实心点本体做轻微缩放，外面一圈 ::after 向外扩散并淡出。
       * 只有在线才加 .dot-live，离线是静态实心点。
       */
      .dot { @apply relative inline-block size-2 shrink-0 rounded-full; }
      .dot-live { animation: breathe 2.4s ease-in-out infinite; }
      .dot-live::after {
        content: '';
        @apply absolute inset-0 rounded-full;
        background-color: inherit;
        animation: ripple 2.4s ease-out infinite;
      }
      @keyframes breathe {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(0.86); }
      }
      @keyframes ripple {
        0%   { transform: scale(1);   opacity: 0.55; }
        70%  { transform: scale(3.2); opacity: 0; }
        100% { transform: scale(3.2); opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .aurora { animation: none; }
        /* 停掉动画但保留一圈静态光晕，状态仍然可辨 */
        .dot-live { animation: none; }
        .dot-live::after { animation: none; opacity: 0.25; transform: scale(2); }
      }
    </style>
  </head>
  <body class="km-layout">
    <!-- 背景层，纯装饰 -->
    <div class="bg-layer" aria-hidden="true">
      <div class="aurora"></div>
      <div class="grid-lines"></div>
    </div>

    <header
      class="km-navbar sticky top-0 z-20 border-b hair bg-white/70 backdrop-blur-xl
             dark:bg-slate-950/70"
    >
      <div class="mx-auto flex h-15 max-w-[1600px] items-center gap-2.5 px-4 sm:px-6">
        <span
          class="grid size-8 place-items-center rounded-lg bg-gradient-to-br
                 from-indigo-500 to-violet-600 text-[13px] font-bold text-white"
        >M</span>
        <span class="text-[15px] font-semibold tracking-tight">Komari</span>

        <div class="ml-1.5 hidden items-center gap-2 sm:flex">
          <span class="chip bg-emerald-50 text-emerald-600 dark:bg-emerald-500/10 dark:text-emerald-400">
            在线 <b class="num">6</b>
          </span>
          <span class="chip bg-rose-50 text-rose-600 dark:bg-rose-500/10 dark:text-rose-400">
            离线 <b class="num">1</b>
          </span>
        </div>

        <div class="flex-1"></div>

        <div class="km-view-switch seg">
          <button data-view="grid" class="seg-on">卡片</button>
          <button data-view="table" class="seg-off">表格</button>
        </div>

        <!-- 列配置：只在表格视图出现 -->
        <div id="col-wrap" class="km-column-picker relative hidden">
          <button id="col-btn" class="iconbtn" title="选择列">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 class="size-4.5"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          </button>
          <div id="col-menu"
               class="absolute right-0 top-11 z-30 hidden w-40 rounded-xl border
                      border-slate-200 bg-white p-1.5 shadow-lg
                      dark:border-slate-700 dark:bg-slate-800"></div>
        </div>

        <button class="iconbtn" title="语言">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               class="size-4.5"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/>
            <path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/></svg>
        </button>
        <button id="theme-toggle" class="iconbtn" title="外观">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               class="size-4.5 dark:hidden"><circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               class="hidden size-4.5 dark:block"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
        </button>
      </div>
    </header>
    <main class="km-main km-page-index mx-auto max-w-[1600px] px-4 py-5 sm:px-6">
      <!-- 汇总条：一行四格 -->
      <section class="km-index-summary card mb-4 grid grid-cols-2 divide-slate-100 p-0
                      dark:divide-slate-800 sm:grid-cols-4 sm:divide-x">
        <div class="px-4 py-3.5">
          <p class="lb">节点</p>
          <p class="num mt-1 text-2xl font-semibold leading-tight">
            6<span class="text-sm font-normal text-slate-400">/7</span>
          </p>
        </div>
        <div class="px-4 py-3.5">
          <p class="lb">实时网速</p>
          <p class="num mt-1 text-[15px] font-semibold leading-snug">
            <span class="t-cpu">&uarr;</span> 61.4 MB/s
            <span class="ml-1.5 t-quo">&darr;</span> 120 MB/s
          </p>
        </div>
        <div class="px-4 py-3.5">
          <p class="lb">总流量</p>
          <p class="num mt-1 text-[15px] font-semibold leading-snug">
            <span class="t-cpu">&uarr;</span> 97.5 TB
            <span class="ml-1.5 t-quo">&darr;</span> 143 TB
          </p>
        </div>
        <div class="px-4 py-3.5">
          <p class="lb">平均负载</p>
          <p class="num mt-1 text-2xl font-semibold leading-tight">3.27</p>
        </div>
      </section>

      <!--
        四列只在 1920px 以上开。1536px 就上四列的话单卡宽度掉到 360px 左右，
        2x2 的占用格子会挤，「13.9 GB / 15.6 GB」这种会换行。
      -->
      <section id="view-grid"
               class="km-index-grid grid gap-3 lg:grid-cols-2 2xl:grid-cols-3
                      min-[1920px]:grid-cols-4"></section>

      <section id="view-table" class="km-index-table card hidden overflow-hidden p-0">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="border-b hair bg-slate-50/70 text-left text-[12px]
                          font-medium text-slate-400 dark:bg-slate-800/40">
              <tr id="table-head"></tr>
            </thead>
            <tbody id="table-body" class="divide-y divide-slate-100 dark:divide-slate-800"></tbody>
          </table>
        </div>
      </section>
    </main>

    <footer class="km-footer mx-auto max-w-[1600px] px-4 pb-8 pt-1 sm:px-6">
      <div class="border-t hair pt-3.5 text-center text-[13px] text-slate-400">
        <p>Powered by Komari Monitor.</p>
      </div>
    </footer>
    <script>
      const K = 1024, M = K * 1024, G = M * 1024, T = G * 1024
      /* 单位随数值走，B/KB/MB/GB/TB 自动切；short 给窄列用 */
      const size = (n, short = false) => {
        if (!n) return short ? '0' : '0 B'
        const u = short ? ['B','K','M','G','T','P'] : ['B','KB','MB','GB','TB','PB']
        const i = Math.min(Math.floor(Math.log(n) / Math.log(1024)), u.length - 1)
        const v = n / 1024 ** i
        const d = i === 0 ? 0 : v >= 100 ? 0 : v >= 10 ? 1 : 2
        return `${v.toFixed(d)}${short ? '' : ' '}${u[i]}`
      }
      /* net_in / net_out 是 bit/s */
      const speed = (bps) => `${size(bps / 8, true)}/s`

      /* 在线时长：天 + 小时 */
      const up = (s) => {
        if (!s) return '—'
        const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600)
        const m = Math.floor((s % 3600) / 60)
        return d ? `${d}天${h}小时` : h ? `${h}小时${m}分` : `${m}分`
      }
      /* 到期日显示成 MM/DD/YYYY */
      const mdy = (iso) => {
        if (!iso) return null
        const [y, m, d] = iso.split('-')
        return `${m}/${d}/${y}`
      }
      const leftDays = (iso) => (iso ? Math.ceil((new Date(iso) - Date.now()) / 86400000) : null)
      const tags = (s) => (s ? s.split(';').filter(Boolean) : [])

      /* traffic_limit_type 决定「已用流量」怎么从总上下行算出来 */
      const usedTraffic = (n) => {
        const { tx, rx, limit_type: k } = n
        return k === 'up' ? tx : k === 'down' ? rx
          : k === 'max' ? Math.max(tx, rx) : k === 'min' ? Math.min(tx, rx) : tx + rx
      }
      /* 75% 转橙、90% 转红，否则用该指标自己的颜色 */
      const fillOf = (p, base) => (p >= 90 ? 'f-bad' : p >= 75 ? 'f-warn' : `f-${base}`)
      const textOf = (p, base) => (p >= 90 ? 't-bad' : p >= 75 ? 't-warn' : `t-${base}`)

      const TAG_COLORS = [
        'bg-indigo-50 text-indigo-600 dark:bg-indigo-500/10 dark:text-indigo-400',
        'bg-teal-50 text-teal-600 dark:bg-teal-500/10 dark:text-teal-400',
        'bg-fuchsia-50 text-fuchsia-600 dark:bg-fuchsia-500/10 dark:text-fuchsia-400',
      ]
      const PILL_TONE = {
        cpu:  'bg-indigo-50 text-indigo-600 dark:bg-indigo-500/10 dark:text-indigo-400',
        mem:  'bg-violet-50 text-violet-600 dark:bg-violet-500/10 dark:text-violet-400',
        swap: 'bg-teal-50 text-teal-600 dark:bg-teal-500/10 dark:text-teal-400',
        warn: 'bg-orange-50 text-orange-600 dark:bg-orange-500/10 dark:text-orange-400',
        bad:  'bg-rose-50 text-rose-600 dark:bg-rose-500/10 dark:text-rose-400',
      }
      /* 三网药丸，单位 ms 写在区块标题上，省一次重复 */
      const pingChip = (name, v, tone) => {
        const t = v < 0 ? 'bad' : v >= 200 ? 'warn' : tone
        return `
        <span class="pill ${PILL_TONE[t]}">
          <span class="opacity-60">${name}</span>
          <span class="num text-[13px] font-semibold">${v < 0 ? '超时' : v}</span>
        </span>`
      }
      /*
       * 发行版官方图标。path 取自 Simple Icons (CC0)，是真实的官方图形。
       * 只内置常见几个，认不出来的回落到一个通用终端图形。
       * 真实主题里把这段抽成 src/components/OsIcon.tsx。
       */

                <span class="qmark-sm">?</span>
                <span class="tip">
                  系统在 <b>1 / 5 / 15 分钟</b> 内的平均任务排队数。
                  持续超过 CPU 核心数（本机 ${n.cores}）说明已经开始堵了。
                </span>
              </span>
            </p>
            <p class="num text-[13px]">
              <b class="font-semibold">${n.load.toFixed(2)}</b>
              <span class="mx-1 text-slate-300 dark:text-slate-600">/</span>
              <b class="font-semibold">${n.load5.toFixed(2)}</b>
              <span class="mx-1 text-slate-300 dark:text-slate-600">/</span>
              <b class="font-semibold">${n.load15.toFixed(2)}</b>
            </p>
          </div>
        </div>

        <!-- 底部：到期靠左（过期药丸紧跟其后），在线靠右 -->
        <div class="mt-2.5 flex flex-wrap items-center justify-between gap-x-3 gap-y-1
                    border-t hair pt-2 text-[12px]">
          <span class="num flex items-center gap-1.5">
            <span class="text-slate-400">到期:</span>
            ${n.expired
              ? `<span class="${expired ? 't-bad font-semibold' : left <= 14 ? 't-warn font-semibold' : ''}">${mdy(n.expired)}</span>`
              : '<span class="text-slate-400">永久</span>'}
            ${expired
              ? `<span class="pill bg-rose-500 text-white">已过期 ${-left} 天</span>`
              : left !== null && left <= 14
                ? `<span class="pill bg-orange-50 text-orange-600 dark:bg-orange-500/10 dark:text-orange-400">剩 ${left} 天</span>`
                : ''}
          </span>
          <span class="num ${dim}">
            <span class="text-slate-400">在线:</span> ${up(n.uptime)}
          </span>
        </div>
      </article>`
      }

      document.getElementById('view-grid').innerHTML = nodes.map(card).join('')
      /* 表格里的指标：条 + 百分比一行，已用/总量分列在下一行左右 */
      const tc = (base, p, usedTxt, totalTxt) => {
        const off = p === null
        return `
        <div class="w-[120px]">
          <div class="flex items-center gap-1.5">
            <div class="track flex-1">
              ${off ? '' : `<div class="bar ${fillOf(p, base)}" style="width:${Math.min(p,100).toFixed(1)}%"></div>`}
            </div>
            <span class="num w-8 text-right text-[12px] font-semibold ${off ? 'text-slate-400' : textOf(p, base)}">
              ${off ? '—' : `${p.toFixed(0)}%`}
            </span>
          </div>
          <div class="mt-0.5 flex items-baseline justify-between">
            <span class="num text-[12px] ${off ? 'text-slate-400' : textOf(p, base)}">${usedTxt}</span>
            <span class="num text-[12px] text-slate-400">${totalTxt}</span>
          </div>
        </div>`
      }

      /*
       * 列注册表。on 决定默认是否显示 —— 默认只开 7 列，配置/Swap/流量限额/
       * 负载/三网/在线默认收起，用右上角的列按钮勾选。
       * 真实主题里这份配置存 localStorage，或做成 theme_settings 的一项。
       */
      const COLUMNS = [
        { key:'name', label:'节点', on:true, cell:(n) => `
            <div class="flex items-center gap-2">
              <span class="flex shrink-0 items-center gap-1.5">
                ${flag(n.region)}
                ${osIcon(n.os)}
                <span class="dot ${n.online ? 'dot-live bg-emerald-500' : 'bg-rose-500'}"></span>
              </span>
              <span class="ml-1 whitespace-nowrap text-[14px] font-medium">${n.name}</span>
            </div>` },

        { key:'spec', label:'配置', on:false, cell:(n) =>
            `<span class="num whitespace-nowrap text-[12px] text-slate-400">
               ${n.cores}核 ${size(n.mem_total, true)} ${size(n.disk_total, true)}
             </span>` },

        { key:'cpu', label:'CPU', on:true, cell:(n) =>
            tc('cpu', n.cpu, `${(n.cores * n.cpu / 100).toFixed(1)}核`, `${n.cores}核`) },

        { key:'mem', label:'内存', on:true, cell:(n) =>
            tc('mem', n.mem_total ? (n.mem / n.mem_total) * 100 : 0,
               size(n.mem, true), size(n.mem_total, true)) },

        { key:'disk', label:'硬盘', on:true, cell:(n) =>
            tc('disk', n.disk_total ? (n.disk / n.disk_total) * 100 : 0,
               size(n.disk, true), size(n.disk_total, true)) },

        { key:'swap', label:'Swap', on:false, cell:(n) => (n.swap_total > 0
            ? tc('swap', (n.swap / n.swap_total) * 100, size(n.swap, true), size(n.swap_total, true))
            : tc('swap', null, '未开启', '')) },

        { key:'net', label:'实时网速', on:true, cell:(n) => `
            <div class="num whitespace-nowrap text-[12px]">
              <span class="t-cpu">&uarr;</span> ${speed(n.net_out)}<br />
              <span class="t-quo">&darr;</span> ${speed(n.net_in)}
            </div>` },

        { key:'traffic', label:'总流量', on:true, cell:(n) => `
            <div class="num whitespace-nowrap text-[12px]">
              <span class="t-cpu">&uarr;</span> ${size(n.tx, true)}<br />
              <span class="t-quo">&darr;</span> ${size(n.rx, true)}
            </div>` },

        { key:'quota', label:'流量限额', on:false, cell:(n) => (n.limit
            ? tc('quo', (usedTraffic(n) / n.limit) * 100, size(usedTraffic(n), true), size(n.limit, true))
            : tc('quo', null, size(usedTraffic(n), true), '不限')) },

        { key:'load', label:'负载', on:false, cell:(n) => `
            <div class="num whitespace-nowrap text-[12px]">
              <b class="text-[13px] font-semibold">${n.load.toFixed(2)}</b><br />
              <span class="text-slate-400">${n.load5.toFixed(2)}/${n.load15.toFixed(2)}</span>
            </div>` },

        { key:'ping', label:'三网延迟', on:false, cell:(n) => `
            <div class="flex flex-wrap gap-1">
              ${pingChip('电', n.ping.ct, 'cpu')}
              ${pingChip('联', n.ping.cu, 'mem')}
              ${pingChip('移', n.ping.cm, 'swap')}
            </div>` },

        { key:'uptime', label:'在线', on:false, cell:(n) =>
            `<span class="num whitespace-nowrap text-[12px]">${up(n.uptime)}</span>` },

        { key:'expire', label:'到期', on:true, cell:(n) => {
            const left = leftDays(n.expired)
            const gone = left !== null && left < 0
            return `
            <div class="num whitespace-nowrap text-[12px]">
              <span class="${gone ? 't-bad' : ''}">${n.expired ? mdy(n.expired) : '永久'}</span><br />
              <span class="${gone ? 't-bad font-semibold'
                : left !== null && left <= 14 ? 't-warn font-semibold' : 'text-slate-400'}">
                ${left === null ? '—' : gone ? `已过期${-left}天` : `剩${left}天`}
              </span>
            </div>` } },
      ]
      const shown = () => COLUMNS.filter((c) => c.on)

      const renderTable = () => {
        document.getElementById('table-head').innerHTML = shown()
          .map((c, i) => `<th class="${i === 0 ? 'px-4' : 'px-2.5'} py-2.5">${c.label}</th>`)
          .join('')

        document.getElementById('table-body').innerHTML = nodes.map((n) => `
          <tr class="km-node-row transition hover:bg-slate-50 dark:hover:bg-slate-800/40
                     ${n.online ? '' : 'opacity-45'}">
            ${shown().map((c, i) =>
              `<td class="${i === 0 ? 'px-4' : 'px-2.5'} py-2.5 align-middle">${c.cell(n)}</td>`
            ).join('')}
          </tr>`).join('')
      }

      const renderColMenu = () => {
        document.getElementById('col-menu').innerHTML = COLUMNS.map((c) => `
          <label class="flex cursor-pointer items-center gap-2 rounded-lg px-2 py-1.5
                        text-[13px] hover:bg-slate-100 dark:hover:bg-slate-700">
            <input type="checkbox" data-col="${c.key}" ${c.on ? 'checked' : ''}
                   ${c.key === 'name' ? 'disabled' : ''}
                   class="size-3.5 accent-indigo-500" />
            <span class="${c.key === 'name' ? 'text-slate-400' : ''}">${c.label}</span>
          </label>`).join('')

        document.querySelectorAll('#col-menu input').forEach((box) => {
          box.onchange = () => {
            COLUMNS.find((c) => c.key === box.dataset.col).on = box.checked
            renderTable()
          }
        })
      }

      renderTable()
      renderColMenu()

      const colMenu = document.getElementById('col-menu')
      document.getElementById('col-btn').onclick = (e) => {
        e.stopPropagation()
        colMenu.classList.toggle('hidden')
      }
      document.addEventListener('click', () => colMenu.classList.add('hidden'))
      colMenu.onclick = (e) => e.stopPropagation()

      /* 真实主题里这里是 useAppearance() 写 localStorage 的 appearance 键 */
      document.getElementById('theme-toggle').onclick = () =>
        document.documentElement.classList.toggle('dark')

      document.querySelectorAll('.km-view-switch button').forEach((btn) => {
        btn.onclick = () => {
          const grid = btn.dataset.view === 'grid'
          document.getElementById('view-grid').classList.toggle('hidden', !grid)
          document.getElementById('view-table').classList.toggle('hidden', grid)
          /* 列配置只对表格有意义 */
          document.getElementById('col-wrap').classList.toggle('hidden', grid)
          colMenu.classList.add('hidden')
          document.querySelectorAll('.km-view-switch button').forEach((b) => {
            b.className = b === btn ? 'seg-on' : 'seg-off'
          })
        }
      })
    </script>
  </body>
</html>
